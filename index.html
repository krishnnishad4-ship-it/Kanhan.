<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        }

        .calculator {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 70px;
            background-color: #22252d;
            color: #ffffff;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #f0f4f8;
            color: #333;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #e2e8f0;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: #4f46e5;
            color: white;
        }

        .operator:hover {
            background-color: #4338ca;
        }

        .equal {
            background-color: #10b981;
            color: white;
            grid-column: span 2;
        }

        .equal:hover {
            background-color: #059669;
        }

        .clear {
            background-color: #ef4444;
            color: white;
        }

        .clear:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendCharacter('/')" class="operator">&divide;</button>
            <button onclick="appendCharacter('*')" class="operator">&times;</button>
            <button onclick="deleteLast()" class="operator">&larr;</button>
            
            <button onclick="appendCharacter('7')">7</button>
            <button onclick="appendCharacter('8')">8</button>
            <button onclick="appendCharacter('9')">9</button>
            <button onclick="appendCharacter('-')" class="operator">-</button>
            
            <button onclick="appendCharacter('4')">4</button>
            <button onclick="appendCharacter('5')">5</button>
            <button onclick="appendCharacter('6')">6</button>
            <button onclick="appendCharacter('+')" class="operator">+</button>
            
            <button onclick="appendCharacter('1')">1</button>
            <button onclick="appendCharacter('2')">2</button>
            <button onclick="appendCharacter('3')">3</button>
            <button onclick="calculateResult()" class="equal">=</button>
            
            <button onclick="appendCharacter('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendCharacter('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendCharacter(char) {
            display.value += char;
        }

        function clearDisplay() {
            display.value = '';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculateResult() {
            try {
                // eval() safely evaluates the math expression string
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>

</body>
</html>
